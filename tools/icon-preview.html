<!doctype html>
<meta charset="utf-8">
<title>Calendar icons</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 2rem;
    font: 14px/1.4 system-ui, sans-serif;
    color: #0a0a0a;
    background: #e8e8e8;
  }
  h1 { margin: 0; font-size: 1.1rem; text-align: center; }
  .row { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 0.6rem; }
  img {
    display: block;
    background: #ccc;
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }
  .s192 { width: 192px; height: 192px; }
  .s512 { width: 256px; height: 256px; }
</style>
<h1>Seclusa Calendar — PWA icons</h1>
<div class="row">
  <figure>
    <img class="s192" src="../icon-192.png" alt="icon-192">
    <figcaption>icon-192.png</figcaption>
  </figure>
  <figure>
    <img class="s512" src="../icon-512.png" alt="icon-512">
    <figcaption>icon-512.png</figcaption>
  </figure>
  <figure>
    <img class="s512" src="../icon-maskable-512.png" alt="icon-maskable-512">
    <figcaption>icon-maskable-512.png</figcaption>
  </figure>
  <figure>
    <img class="s512" src="../icon.svg" alt="icon.svg">
    <figcaption>icon.svg</figcaption>
  </figure>
</div>
